[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klanex"
version = "0.1.0"
description = "Official Python SDK for klanex — the tool orchestration engine for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Aljaž Klaneček" }]
keywords = ["klanex", "ai-agents", "tool-use", "llm", "orchestration", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/chrassy/klanex-python"
Repository = "https://github.com/chrassy/klanex-python"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/klanex"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
